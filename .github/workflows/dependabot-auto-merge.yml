name: Dependabot auto-merge

# Enables auto-merge on Dependabot pull requests for non-major updates of GitHub
# Actions and the pinned CI tooling, from icl-common-infra
# (dependabot-auto-merge.yml there). The merge queue then takes the pull request
# once CI Status and Scan dependency diff pass. vcpkg updates and every major
# update are left for a person. Needs the Dependabot secret MERGE_QUEUE_TOKEN
# (an organisation secret; docs/releasing.md).

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
