name: Fuzz

# The libFuzzer harnesses of libs/core/fuzz and libs/scan/fuzz (docs/fuzzing.md). The pull request gate
# replays the seeds and the past crashes (the `Fuzz regression` job of ci.yml, a few seconds). This
# workflow fuzzes:
#
#   push to develop   60 seconds per target ("fuzz-short"), one run at a time
#   schedule          10 minutes per target ("fuzz-nightly"), with the corpus kept between runs
#   manual            the seconds named, on the branch named
#
# A crash fails the run, uploads the input that caused it as an artifact, and (on the schedule) opens or
# updates one `nightly-analysis` issue. The fix adds the input to libs/<lib>/fuzz/regressions/<target>/.
#
# Not a required check: it is not on a pull request or the merge queue, and nothing here blocks a merge.

on:
  push:
    branches: [develop]
  schedule:
    # 03:47 UTC: after the nightly analysis (02:17) and CodeQL (02:47) and clear of the weekly release
    # rehearsal (Sunday 03:23).
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target.
        type: string
        default: "60"

concurrency:
  group: fuzz-${{ github.event_name == 'push' && 'push' || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  fuzz:
    name: Fuzz (Linux, Clang)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || github.event_name == 'workflow_dispatch' && inputs.seconds || '60' }}
    steps:
      # A schedule runs the default branch (develop); a push is develop; a dispatch is the branch named.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Ensure Clang and its sanitizer runtime
        shell: bash
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          major="$(clang++ -dumpversion | cut -d. -f1)"
          if ! dpkg -s "libclang-rt-${major}-dev" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y "libclang-rt-${major}-dev"
          fi
          clang++ --version | head -n 1

      - name: Configure and build
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz

      # The inputs found so far, kept between runs under a key of their own (the newest entry of the
      # prefix is restored; each run saves a new one).
      - name: Restore the fuzzing corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # Every target, each from the committed seeds and regressions plus what earlier runs found. A
      # new input goes to fuzz-work; a crash leaves its input in fuzz-crashes.
      - name: Fuzz every target
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p fuzz-work fuzz-crashes
          failed=0
          for exe in build/linux-fuzz/bin/sns_fuzz_*; do
            target="${exe##*/sns_fuzz_}"
            dirs=(libs/*/fuzz/corpus/"$target" libs/*/fuzz/regressions/"$target")
            mkdir -p "fuzz-work/$target"
            echo "::group::$target ($SECONDS_PER_TARGET s)"
            if ! "$exe" -max_total_time="$SECONDS_PER_TARGET" -artifact_prefix="fuzz-crashes/${target}-" \
                  "fuzz-work/$target" "${dirs[@]}"; then
              echo "::error::$target crashed; the input is in the fuzz-crashes artifact"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Save the fuzzing corpus
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 30

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          engine: libFuzzer
          detail: A fuzz target crashed or the run failed. The crashing input is in the fuzz-crashes artifact of the run; add it to libs/<lib>/fuzz/regressions/<target>/ in the fix.
