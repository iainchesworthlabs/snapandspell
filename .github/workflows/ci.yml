name: CI

# What each job proves, and which of them are required status checks:
# docs/ci.md and docs/branch-protection.md. The required checks are CI Status
# and Scan dependency diff (dependency-review.yml); CI Status waits for the
# other jobs by id, so their display names can change.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  # develop has a merge queue (docs/branch-protection.md) and
  # this workflow produces required checks, so it has to report on the queue's
  # temporary gh-readonly-queue/... ref as well: GitHub only runs workflows
  # that opt in there, and a required check that never reports holds the entry
  # until its timeout.
  merge_group:
    branches: [develop]
  # Manual runs can name the legs they want, so a fix to one platform does not
  # pay for all of them (macOS minutes are billed at a multiple):
  #   gh workflow run ci.yml --ref <branch> -f legs=macos
  # Jobs of a dispatched run are renamed "dispatch - <name>", so a run that
  # skips legs can never report a "skipped" (which counts as a pass) under a
  # required check's name on the branch's head commit.
  workflow_dispatch:
    inputs:
      legs:
        description: >-
          Comma-separated legs to run, no spaces: clang-format,
          platform-isolation, windows, linux, macos, coverage, perf, package - or "all".
          The dedicated profiling builds (optimised, for Tracy numbers) are
          never part of "all": name them - profiling (all three),
          profiling-windows, profiling-linux or profiling-macos. The debug
          legs build Tracy by default (docs/profiling.md), whatever legs run.
        type: string
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.legs }}
  # A push to develop or main runs to the end: it is the run that stores the
  # vcpkg cache that pull requests restore from. Everything else is superseded
  # by the next push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

# No job gets more than it names below.
permissions: {}

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # The static checks that need no build, from icl-common-infra: branch name,
  # commit and pull request text, preprocessor policy, action pinning, the
  # changelog fragment, the vcpkg baseline and REUSE. It runs on drafts too.
  policy:
    name: Policy
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/policy.yml@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13

  # cmake/icl is a copy of the modules in icl-common-infra at the commit this
  # file pins. A bump of the pin fails here until tools/ci/repin.py has been
  # run (docs/building.md, "Shared CMake modules").
  icl-cmake:
    name: Vendored CMake modules
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
      - name: Compare cmake/icl with the pinned commit
        run: python3 tools/ci/sync_cmake.py --check --infra .icl-infra

  # The repository's .clang-format, one pinned release (the wheel pinned in
  # .github/requirements/lint.txt, not whatever the runner image ships, so an
  # image bump cannot change the formatting rules under an unchanged tree).
  clang-format:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - clang-format' || 'clang-format' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',clang-format,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install clang-format (pinned)
        run: |
          uv venv "$RUNNER_TEMP/lint-venv"
          uv pip install --python "$RUNNER_TEMP/lint-venv/bin/python" --requirement .github/requirements/lint.txt
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lint-venv/bin/clang-format" --version

      # Any difference is a failure; --dry-run --Werror reports file:line.
      - name: Check formatting (libs/, apps/ and tests/)
        shell: bash
        run: |
          mapfile -d '' files < <(find libs apps tests -type f \( \
            -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' -o -name '*.hh' \
            -o -name '*.cxx' -o -name '*.hxx' -o -name '*.inl' -o -name '*.ipp' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no C++ sources found under libs/, apps/ and tests/"
            exit 1
          fi
          echo "checking ${#files[@]} file(s) with $(clang-format --version)"
          if ! clang-format --dry-run --Werror "${files[@]}"; then
            echo "::error::formatting differs from .clang-format; run: clang-format -i <file>"
            exit 1
          fi

  # The no-#ifdef rule (docs/platform-isolation.md): the operating system is a
  # CMake decision, so no platform code, OS header or runtime OS test may sit
  # outside libs/platforms. Cheap, fast and deliberately not behind the build
  # legs, so a violation is reported even while a porting leg is red.
  platform-isolation:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - platform-isolation' || 'platform-isolation' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',platform-isolation,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pwsh ships on every hosted image; the check asks git which files are
      # source, so it runs inside the checkout.
      - name: Check for platform code outside the platform section
        shell: pwsh
        run: ./tools/checks/check_platform_isolation.ps1 -Root $PWD

  # Checks the legs a manual dispatch names (an unknown name fails the run
  # rather than running nothing). The legs themselves do not wait for this job:
  # they pick themselves from the same input (build-and-test below). It is a
  # required check, so it stays, and it is a job of its own so that a bad name
  # is a red check with a message.
  plan:
    name: Plan build legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the named legs
        shell: bash
        env:
          LEGS: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'all' }}
        run: |
          case "$LEGS" in
            *[[:space:]]*)
              echo "::error::legs must be comma-separated with no spaces: '$LEGS'"
              exit 1 ;;
          esac
          for leg in ${LEGS//,/ }; do
            case "$leg" in
              all|clang-format|platform-isolation|windows|linux|macos|coverage|perf|package) ;;
              profiling|profiling-windows|profiling-linux|profiling-macos) ;;
              *) echo "::error::unknown leg '$leg' (clang-format, platform-isolation, windows, linux, macos, coverage, perf, package, profiling, profiling-windows, profiling-linux, profiling-macos, all)"
                 exit 1 ;;
            esac
          done
          echo "legs: $LEGS"

  # Configure, build and test one preset per desktop platform. The Debug
  # presets turn on the sanitizers, Tracy (on by default for Debug builds:
  # docs/profiling.md) and every warning is an error, so a green leg means:
  # the tree compiles warning-free on that compiler, and the unit tests,
  # platform.fragments and platform.isolation pass under ASan (and UBSan where
  # the compiler has it).
  build-and-test:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - ' || '' }}${{ fromJSON('{"windows":"Windows (MSVC)","linux":"Linux (GCC)","macos":"macOS (AppleClang)","profiling-windows":"Profiling (Windows, MSVC)","profiling-linux":"Profiling (Linux, GCC)","profiling-macos":"Profiling (macOS, AppleClang)"}')[matrix.leg] }}
    # No `needs: plan`. The legs used to wait for it, and a job that takes three
    # seconds still waits for a runner like any other: on a busy day the Windows
    # leg began half an hour after the run did, behind a three-second job, while
    # the ungated release package job began after one minute. A push, pull
    # request or queue run always gets the first three legs; a dispatch picks
    # from its `legs` input, here and in the matrix's `exclude` below.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',windows,')) || (github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',linux,')) || (github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',macos,')) || (github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-windows,'))) || (github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-linux,'))) || (github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-macos,'))) }}
    runs-on: ${{ fromJSON('{"windows":"windows-2025-vs2026","linux":"ubuntu-26.04","macos":"macos-26","profiling-windows":"windows-2025-vs2026","profiling-linux":"ubuntu-26.04","profiling-macos":"macos-26"}')[matrix.leg] }}
    # The Windows leg builds the application and its prototype with the
    # sanitizers on and then runs about a thousand tests; on a hosted runner
    # that is 40 minutes or more, so 45 cancelled it in its last step.
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # What each leg builds with; the steps read these where they used to read the matrix.
      WJS_PRESET: ${{ fromJSON('{"windows":"windows-msvc-debug","linux":"linux-gcc-debug","macos":"macos-clang-debug","profiling-windows":"windows-msvc-profiling","profiling-linux":"linux-gcc-profiling","profiling-macos":"macos-clang-profiling"}')[matrix.leg] }}
      WJS_TRIPLET: ${{ fromJSON('{"windows":"x64-windows","linux":"x64-linux","macos":"arm64-osx","profiling-windows":"x64-windows","profiling-linux":"x64-linux","profiling-macos":"arm64-osx"}')[matrix.leg] }}
    strategy:
      fail-fast: false
      matrix:
        # One desktop leg per platform, each on its own default compiler: MSVC
        # on the VS 2026 image, the image's g++ on Ubuntu, AppleClang (Xcode) on
        # the Apple-silicon macOS image. The runner, the preset and the vcpkg
        # triplet (which names the binary cache) of each are looked up from the
        # leg's name, above and in the job's `env`, and are not carried in the
        # matrix: an `include` entry would bring back a leg that `exclude`
        # dropped. The profiling presets (RelWithDebInfo with Tracy:
        # docs/profiling.md) are the same three platforms and run only when a
        # dispatch names them: the client opens a network port and the vcpkg
        # tools take a while to build, so a push does not pay for them as well
        # as for the debug legs, which are instrumented by default.
        leg: [windows, linux, macos, profiling-windows, profiling-linux, profiling-macos]
        # The legs this run does not want. The list always ends in a leg that
        # matches nothing, so that it is valid JSON whatever was dropped.
        exclude: ${{ fromJSON(format('[{0}{1}{2}{3}{4}{5}{{"leg":"none"}}]', !(github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',windows,')) && '{"leg":"windows"},' || '', !(github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',linux,')) && '{"leg":"linux"},' || '', !(github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == '' || contains(format(',{0},', inputs.legs), ',macos,')) && '{"leg":"macos"},' || '', !(github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-windows,'))) && '{"leg":"profiling-windows"},' || '', !(github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-linux,'))) && '{"leg":"profiling-linux"},' || '', !(github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.legs), ',profiling,') || contains(format(',{0},', inputs.legs), ',profiling-macos,'))) && '{"leg":"profiling-macos"},' || '')) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A full clone of vcpkg at cmake/vcpkg-commit.txt; sets VCPKG_ROOT, which
      # the presets read. Full history, because with a builtin-baseline vcpkg
      # reads historical port versions out of its own git history.
      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      # vcpkg's `files` binary-cache provider plus actions/cache (its x-gha
      # provider was removed). Keyed per triplet; see docs/ci.md.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: ${{ env.WJS_TRIPLET }}

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # Ninja needs cl.exe on PATH; the preset does not set up the VS
      # environment itself.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The Qt Quick application, on the one leg whose platform has had it
      # built: Qt 6.12.0 through install-qt-action, the same prebuilt kit
      # pattern as the shared tree (docs/building.md). The application and the
      # 3D board-scene prototype are built and their tests run, so the QML
      # screens, the scene contract and qmllint are held on every push
      # (docs/ci.md). The base kit carries lupdate and lrelease (from Qt 6.12 qttools is an
      # archive of the base package, no longer a module): the
      # interface's catalogues are compiled at build time and the drift check
      # regenerates them. qtmultimedia, qtsensors and qtspeech are the
      # application's sound, motion and speech; their silent variants exist for
      # a kit without them, but this leg is the one that proves the real engines.
      #
      # aqtsource is a git commit, not a PyPI release: Qt 6.11+ split the
      # Windows repository per architecture and aqtinstall 3.3.0, the last PyPI
      # release, cannot read it. install-qt-action would install that release
      # from PyPI without it. The comment on the pin in
      # .github/toolchain-versions.json says where the commit came from.
      - name: Install Qt (Windows application leg)
        if: matrix.leg == 'windows'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # The Configure step below names the same kit path, as the manual
          # aqtinstall install used to. Without this the action installs under
          # $RUNNER_WORKSPACE instead.
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtquick3d qtshadertools qtmultimedia qtsensors qtspeech"
          cache: true

      # A compiler cache for the Windows build, which is where the minutes are
      # (the debug build with the sanitizers, the application and its tests:
      # about 480 translation units on four cores). A pull request restores what
      # the last push to develop stored; see .github/actions/ccache.
      - name: Set up ccache (Windows)
        if: matrix.leg == 'windows'
        id: ccache
        uses: ./.github/actions/ccache/setup
        with:
          preset: ${{ env.WJS_PRESET }}

      # What the leg actually built with, in the log: the first thing to read
      # when a compiler-specific failure shows up.
      - name: Show the toolchain
        shell: bash
        run: |
          cmake --version | head -n 1
          ninja --version
          case "$RUNNER_OS" in
            Linux) g++ --version | head -n 1 ;;
            macOS) c++ --version | head -n 1 ;;
            Windows) cl 2>&1 | head -n 1 || true ;;
          esac

      # vcpkg builds Tracy's command-line tools for the host in every Linux
      # leg now (the debug presets have Tracy on by default, and the profiling
      # leg builds it for numbers), and on Linux that is a chain of autotools
      # ports (dbus, libxcrypt, libsystemd) that the hosted image does not
      # carry the tools for.
      - name: Install what vcpkg needs for Tracy's tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-tracy-tools

      # The Windows leg also builds the Qt Quick application and its 3D scene
      # prototype, so the app tests, the QML lint and the scene contract run
      # here (docs/ci.md). Every other leg builds the library, CLI and scan
      # layers alone, which is all their hosts have Qt installed for.
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
          QT_ROOT_DIR: ${{ runner.temp }}/Qt/6.12.0/msvc2022_64
        run: |
          if [ "${{ matrix.leg }}" = "windows" ]; then
            # /Z7 puts the debug information in the objects, which is what
            # ccache can store (a shared .pdb it cannot).
            cmake --preset "$CMAKE_PRESET" -DWJS_BUILD_APP=ON -DWJS_BUILD_SHAKE_PROTOTYPE=ON               -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          else
            cmake --preset "$CMAKE_PRESET" -DWJS_BUILD_APP=OFF
          fi

      # vcpkg has built whatever was missing by the end of Configure, so the
      # cache is offered now and not only in the last step: a push to develop is
      # where pull requests get theirs from, and its last step is an hour away.
      # The save at the end of the job stays, for a run that ends before this
      # one; it stores nothing when this one did.
      - name: Save vcpkg binaries (built, before the build)
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: ${{ env.WJS_TRIPLET }}
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
        run: cmake --build --preset "$CMAKE_PRESET"

      # Offered as soon as the objects exist, not in the last step: the test run
      # that follows is long, and a push to develop is where pull requests get
      # their cache from. Nothing is stored unless enough was compiled.
      - name: Save ccache (Windows)
        if: ${{ always() && matrix.leg == 'windows' }}
        uses: ./.github/actions/ccache/save
        with:
          preset: ${{ env.WJS_PRESET }}

      # The test preset errors out when no test is found, so an empty suite
      # cannot pass. The offscreen platform lets the Qt Quick screens run on a
      # runner with no display (apps/app/tests/unit).
      - name: Test
        shell: bash
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
          QT_QPA_PLATFORM: offscreen
          # The offscreen plugin draws text with the fonts in this directory and
          # finds none of its own on Windows: the screen checks and the glyph
          # check need it (libs/platforms/windows/platform.cmake has the same for
          # the CMake tests).
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '' }}
        # Every leg runs one test per core. The Windows suite is about a thousand
        # cases that add up to 2250 s under ASan, and it ran one at a time for
        # 37 minutes; the Linux and macOS suites were 9 and 10 minutes the same
        # way. The cases that need the machine to themselves (a stopwatch, a
        # profiler capture on a fixed port) are RUN_SERIAL and still run alone.
        run: |
          jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          echo "ctest -j $jobs"
          ctest --preset "$CMAKE_PRESET" -j "$jobs"

      # The interface's catalogues are generated: lupdate regenerates them into a
      # temporary directory and the checked-in apps/app/translations/*.ts must be identical, so a
      # qsTr() added without regenerating them fails the Windows leg. It is
      # already in ctest above; this step names the gate. The base kit
      # installed above means lupdate is there, so a missing catalogue is a red
      # step and not a skip (docs/ci.md).
      - name: Interface catalogues (lupdate drift)
        if: matrix.leg == 'windows'
        shell: bash
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
        run: ctest --preset "$CMAKE_PRESET" -R '^i18n\.catalogues$' --output-on-failure

      # The window starts, loads every screen and presents frames, on the leg
      # that builds it: the application's smoke mode (docs/profiling.md). Quick
      # 3D cannot render offscreen, so this exercises the start-up path and the
      # 2D graph; the frame budget itself is a desktop check.
      - name: Application smoke (Windows)
        if: matrix.leg == 'windows'
        shell: bash
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: opengl
        run: build/"$CMAKE_PRESET"/bin/WordJewelsSolver.exe --smoke 60

      # A repeatable package from the same build, and proof it is usable (as a
      # DEVELOPMENT package: check_package.ps1 tells cpack, because this tree is
      # Debug and has Tracy in it; the Windows Release package is the
      # `Package (Windows, Release)` job below): the
      # script a developer runs too (tools/package/check_package.ps1) packs a
      # ZIP with CPack, checks the archive carries the two programs, Qt's DLLs,
      # plugins and QML modules (Quick 3D included), the dictionary, the dice,
      # NOTICES.txt and LICENSE.txt, writes SHA256SUMS, unpacks it, solves a
      # board with the packaged wjs-cli and runs the packaged window's offscreen
      # smoke (docs/building.md#checking-a-package). This leg packages its
      # Debug build, so the artifact is a development build and carries
      # TracyClient.dll by design; the packages that ship come from the
      # release presets, which have Tracy off (tests/profiling/check_presets.cmake).
      # NSIS is configured for a machine that has makensis; this step asks for
      # the ZIP on purpose, and nothing here depends on whether the runner has
      # NSIS.
      - name: Package and check the ZIP (Windows)
        if: matrix.leg == 'windows'
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ env.WJS_PRESET }}
        run: ./tools/package/check_package.ps1 -Build "build/$env:CMAKE_PRESET"

      - name: Upload the package (Windows)
        if: matrix.leg == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # A development package: Debug, with Tracy and the ASan runtime. The
          # name says so, so that it is never taken for the release one.
          name: wordjewelssolver-windows-x64-debug-dev
          path: |
            build/${{ env.WJS_PRESET }}/packages/*.zip
            build/${{ env.WJS_PRESET }}/packages/SHA256SUMS
          if-no-files-found: error

      # Saved even when a later step fails: otherwise a red leg throws away
      # every package vcpkg had already built. Only saves when packages were
      # added since the restore - see .github/actions/vcpkg-cache.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: ${{ env.WJS_TRIPLET }}
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  # The performance tier's work budgets (libs/core/bench; docs/testing.md,
  # "Performance tests"), which the Debug legs above skip: they are counts, the
  # same on every compiler, but only an optimised build runs them in seconds,
  # and this is the one leg that builds a Release preset. One compiler is
  # enough. The wall-time checks are not run on a push or a pull request - a
  # shared runner is the one machine a stopwatch cannot be trusted on - but a
  # manual run (legs=perf, or all) runs them too, so that a person can look.
  # Not a required check.
  performance:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - Performance (Linux, GCC)' || 'Performance (Linux, GCC)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',perf,') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See build-and-test.
      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      # Same triplet, same archives as the Linux (GCC) leg.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: x64-linux

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Configure
        run: cmake --preset linux-gcc-release -DWJS_BUILD_APP=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-release

      # Everything in ctest, so that the Release build is proven too: the unit
      # tests, the two repository checks and the work budgets. The wall-time
      # cases skip themselves (WJS_PERF_TIMING is not set).
      - name: Test
        run: ctest --preset linux-gcc-release -j "$(nproc)"

      # Only by hand: the *-perf test preset sets WJS_PERF_TIMING and selects
      # the perf label, and the timing cases run alone (RUN_SERIAL).
      - name: Wall-time checks (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ctest --preset linux-gcc-perf

      # Saved even when a later step fails - see build-and-test.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: x64-linux
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  # The package that ships, on Windows: the Release preset (the Qt application on,
  # Tracy and the sanitizers off), packaged and checked the way the release
  # workflow will - a ZIP that carries no TracyClient, AddressSanitizer runtime or
  # .pdb, and starts. Debug legs above package a development build; this is the
  # one push-time proof that a Release package is clean, so a regression shows in
  # the pull request and not on the day of a release. No tests are built (the
  # Debug leg runs them, and release.yml runs the whole suite on the Release
  # build). Not a required check.
  package-windows:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - Package (Windows, Release)' || 'Package (Windows, Release)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',package,') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: x64-windows

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The same Qt kit as the Windows leg above (see the comments there).
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtquick3d qtshadertools qtmultimedia qtsensors qtspeech"
          cache: true

      # The same compiler cache as the Windows leg, under its own preset's key.
      - name: Set up ccache
        uses: ./.github/actions/ccache/setup
        with:
          preset: windows-msvc-release

      - name: Configure (Release)
        shell: bash
        env:
          QT_ROOT_DIR: ${{ runner.temp }}/Qt/6.12.0/msvc2022_64
        run: cmake --preset windows-msvc-release -DWJS_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Save ccache
        if: ${{ always() }}
        uses: ./.github/actions/ccache/save
        with:
          preset: windows-msvc-release

      # Release tree: the script forbids TracyClient, clang_rt.asan* and *.pdb in
      # the archive, then unpacks it and runs the packaged programs.
      - name: Package and check the ZIP
        shell: pwsh
        run: ./tools/package/check_package.ps1 -Build build/windows-msvc-release

      - name: Check the build and the package
        shell: pwsh
        run: ./tools/release/check_release_build.ps1 -Build build/windows-msvc-release -Expect .zip

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordjewelssolver-windows-x64
          path: |
            build/windows-msvc-release/packages/*.zip
            build/windows-msvc-release/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # Saved even when a later step fails - see build-and-test.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: x64-windows
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  # Line and branch coverage of the unit tier (libs/core), gated at the project's
  # minimum standard: 90% of lines and 80% of branches. The same gate is the
  # `coverage-unit` build target locally (tools/coverage/run_coverage.cmake);
  # this job runs the unit label and then gcovr directly, so the report is also
  # the CI job summary and an artifact. A failure here is a coverage failure,
  # not a flaky test: the unit suite has just passed.
  coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch - Coverage (Linux, GCC)' || 'Coverage (Linux, GCC)' }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || contains(format(',{0},', inputs.legs), ',coverage,') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See build-and-test.
      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      # Same triplet, same archives as the Linux (GCC) leg.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: x64-linux

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install gcovr (pinned)
        run: |
          uv venv "$RUNNER_TEMP/cov-venv"
          uv pip install --python "$RUNNER_TEMP/cov-venv/bin/python" --requirement .github/requirements/coverage.txt
          echo "$RUNNER_TEMP/cov-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cov-venv/bin/gcovr" --version | head -n 1

      # gcov has to be the one that goes with the compiler that built the
      # objects: a mismatch reads as "version mismatch" or an empty report.
      - name: Pick the matching gcov
        shell: bash
        run: |
          g++ --version | head -n 1
          major="$(g++ -dumpversion | cut -d. -f1)"
          if command -v "gcov-$major" >/dev/null 2>&1; then
            echo "GCOV=gcov-$major" >> "$GITHUB_ENV"
          else
            echo "GCOV=gcov" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset linux-gcc-coverage -DWJS_BUILD_APP=OFF

      - name: Build
        run: cmake --build --preset linux-gcc-coverage

      - name: Unit tier (the tier the coverage gate measures)
        run: ctest --preset linux-gcc-coverage -L unit -j "$(nproc)"

      # --gcov-ignore-parse-errors ...warn_once_per_file: a counter gcov reads
      # back negative (gcc bug 68080) is taken as zero and named once, rather
      # than aborting the report. The coverage preset already updates counters
      # atomically, which is what normally prevents it.
      #
      # --fail-under-line / --fail-under-branch are the gate. The scope is
      # libs/core: the game logic the unit tier owns. The scanner and the window's
      # model have their own integration tiers, and the UI tier's report is
      # `coverage-ui` (docs/testing.md, "Coverage").
      - name: Coverage report and gate (90% lines, 80% branches)
        shell: bash
        run: |
          mkdir -p build/coverage
          gcovr --root . --filter '.*libs/core/.*' \
            --exclude '.*/(tests|ui-tests|bench)/.*' \
            --gcov-executable "$GCOV" \
            --object-directory build/linux-gcc-coverage \
            --exclude-throw-branches --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --fail-under-line 90 --fail-under-branch 80 \
            --print-summary \
            --html-details build/coverage/index.html \
            --json-summary build/coverage/summary.json --json-summary-pretty

      - name: Summarise coverage
        if: ${{ always() && hashFiles('build/coverage/summary.json') != '' }}
        shell: bash
        run: |
          jq -r '"### Coverage of libs/core from the unit tier (gate 90% lines / 80% branches)\n\n| | covered | total | percent |\n|---|---|---|---|\n| lines | \(.line_covered // 0) | \(.line_total // 0) | \(.line_percent // 0) |\n| branches | \(.branch_covered // 0) | \(.branch_total // 0) | \(.branch_percent // 0) |"' \
            build/coverage/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14

      # Saved even when a later step fails - see build-and-test.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: x64-linux
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  # The one check that says whether this run is good. It fails when a job it
  # waits for failed or was cancelled, and when one of them was skipped although
  # the run should have run it. The rulesets require this job and not each
  # leg by name (docs/branch-protection.md). Performance and Package are left
  # out. A manual run names its own legs and skips the rest, so it has no
  # aggregate.
  ci-status:
    name: CI Status
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [policy, icl-cmake, clang-format, platform-isolation, plan, build-and-test, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate
        uses: iainchesworthlabs/icl-common-infra/actions/ci-status@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          needs: ${{ toJSON(needs) }}
