name: Docs

# Builds the documentation site (mkdocs.yml, docs/) with `mkdocs build --strict`
# and publishes it to GitHub Pages from main. Both steps are the shared
# workflows of icl-common-infra (docs.yml and docs-deploy.yml). The strictness
# is the `validation` block of mkdocs.yml: a link to a page or a heading that
# does not exist is a red build, not a dead link on the site.
#
# Not a required check, and not on the merge queue: it runs only when the
# documentation changes, and a check that a path filter keeps from running never
# reports, which would hold every unrelated pull request.
#
# A push to main publishes the site, so the release that fast-forwards main is
# what makes it exist.
# The repository's Pages source is "GitHub Actions" (admin/apply.sh sets it).

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/requirements/docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/requirements/docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  # A deployment is never cancelled half way; a superseded build is.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job gets more than it names below.
permissions: {}

jobs:
  build:
    name: Build the documentation (strict)
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
    with:
      requirements: .github/requirements/docs.txt
      upload: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

  deploy:
    name: Publish to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy.yml@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
