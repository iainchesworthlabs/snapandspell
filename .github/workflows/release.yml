name: Release

# Builds the Release packages on hosted runners, tests them, writes the source
# archive and the SBOM, and hands the files to the shared release workflow of
# icl-common-infra, which writes the checksums, signs them with the
# organisation's GPG key, attests where they were built, publishes a GitHub
# Release and fast-forwards main. What each step proves, and what the author
# does once, is in docs/releasing.md. In short:
#
#   v* tag pushed        a real release: build, test, package, source archive,
#                        SBOM, then the shared Publish job (it waits for the
#                        owner's approval in the `release` environment).
#   workflow_dispatch    a rehearsal that publishes and signs nothing. The
#                        packages are the run's artifacts for 14 days.
#   schedule (weekly)    the same rehearsal, so a release does not meet a broken
#                        Windows/Linux/macOS Release build for the first time on
#                        the day. It does not build iOS: that needs a macOS
#                        runner and the Apple signing secrets, so it runs on a tag
#                        and on a manual dispatch (the `ios` input). Nor does it
#                        build Android (a download of several gigabytes of Qt kits),
#                        which runs on a tag and on a manual dispatch (the `android`
#                        input) and only when the four Android signing secrets are set.
#
# Not a required check, and not on a pull request or the merge queue: nothing
# here blocks a merge. The Release presets turn Tracy off
# (tests/profiling/check_presets.cmake), and each build job fails if the
# profiler is in its cache or in a package it can list.

on:
  push:
    tags: ["v*"]
  schedule:
    # Sunday 03:23 UTC: well away from the nightly analysis (02:17 and 02:47).
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      ios:
        description: >-
          Also build and sign the iOS ad-hoc IPA, with the Apple signing secrets
          (it fails at once if they are not set). Untick it to rehearse the
          desktop packages alone. A tag builds it too, unless the repository
          variable RELEASE_WITHOUT_IOS is true.
        type: boolean
        default: true
      android:
        description: >-
          Also build the signed Android APK and AAB. It does nothing unless the four
          Android signing secrets are set (it says so and the run goes on without
          Android). Untick it to rehearse the other packages alone. A tag builds it
          too.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  # A release is never cancelled half way: a second push of the same tag waits.
  cancel-in-progress: false

# No job gets more than it names below.
permissions: {}

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # Decides what this run is and refuses a tag that cannot be a release: its
  # shape and its version against CMakeLists.txt and vcpkg.json
  # (tools/release/check_release_ref.sh). That the commit is on develop and that the
  # release has notes are checked by the shared Publish job, before anything is signed.
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      suffix: ${{ steps.plan.outputs.suffix }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      # The whole history: whether the tag is on main needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the ref and decide the mode
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IOS_INPUT: ${{ inputs.ios }}
          ANDROID_INPUT: ${{ inputs.android }}
          RELEASE_WITHOUT_IOS: ${{ vars.RELEASE_WITHOUT_IOS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            # A tag builds iOS, unless the author has said, with this repository
            # variable, that a release is to go out without it (an iOS build that
            # is broken must not hold the desktop packages back).
            ios=true
            if [ "${RELEASE_WITHOUT_IOS:-}" = true ]; then
              ios=false
              echo "::warning title=No iOS build::The repository variable RELEASE_WITHOUT_IOS is true, so this release has no iOS IPA. Delete the variable to build it again."
            fi
            {
              echo "mode=release"
              echo "ios=$ios"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            tools/release/check_release_ref.sh --tag "$REF_NAME"
          else
            ios=false
            android=false
            if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$IOS_INPUT" != false ]; then ios=true; fi
            if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$ANDROID_INPUT" != false ]; then android=true; fi
            {
              echo "mode=dry-run"
              echo "ios=$ios"
              echo "android=$android"
            } >> "$GITHUB_OUTPUT"
            tools/release/check_release_ref.sh --dry-run "dryrun.${RUN_NUMBER}"
          fi

  # One Release build per package family. Each configures its Release preset (the
  # application on or off as the leg says, Tracy off, reviewed phonics required),
  # builds, runs the whole ctest suite, packages, smoke-tests what it packaged and
  # checks what is in it.
  #
  #   windows    the Qt Quick application and wjs-cli: ZIP and NSIS installer
  #   linux      wjs-cli: ZIP, tar.gz, deb, rpm (the distributions' own formats
  #              cannot carry a Qt 6.12 application, so they are the solver's)
  #   linux-app  the application as an AppImage that carries Qt
  #   macos      the application bundle and wjs-cli: a disk image, signed and
  #              notarised when the signing secrets exist
  #
  # The Qt kit is the one in .github/toolchain-versions.json for each host. The
  # application has only ever been built on Windows (docs/ci.md, "Not here yet"):
  # linux-app and macos are its first builds elsewhere, so a rehearsal that is red
  # on them is the pipeline doing its job.
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            name: Windows x64 (MSVC, with the application)
            os: windows-2025-vs2026
            preset: windows-msvc-release
            package-preset: package-windows-msvc-release
            triplet: x64-windows
            app: "ON"
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-dir: msvc2022_64
          - leg: linux
            name: Linux x64 (GCC, command line)
            os: ubuntu-26.04
            preset: linux-gcc-release
            package-preset: package-linux-gcc-release
            triplet: x64-linux
            app: "OFF"
          - leg: linux-app
            name: Linux x64 (GCC, with the application, AppImage)
            os: ubuntu-26.04
            preset: linux-gcc-release
            package-preset: package-linux-gcc-release
            triplet: x64-linux
            app: "ON"
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-dir: gcc_64
          - leg: macos
            name: macOS arm64 (AppleClang, with the application)
            os: macos-26
            preset: macos-clang-release
            package-preset: package-macos-clang-release
            triplet: arm64-osx
            app: "ON"
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: ${{ matrix.triplet }}

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Set up MSVC environment (Windows)
        if: matrix.leg == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The Qt kit, from the same pins as ci.yml's Windows leg (the action, the
      # version, the module list and the aqtinstall commit are in
      # .github/toolchain-versions.json; tests/package/test_release_tools.sh holds
      # this file to them). Only the legs that build the application need it.
      - name: Install Qt
        if: matrix.app == 'ON'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtshadertools qtmultimedia qtsensors qtspeech"
          cache: true

      # CPack's NSIS settings are decided at configure time, when makensis is
      # found, so the installer tool goes in before Configure. The image may or
      # may not carry it; a missing one after this is an error, not a package
      # that quietly lacks its installer.
      - name: Install NSIS (Windows)
        if: matrix.leg == 'windows'
        shell: pwsh
        run: |
          $dir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$dir\makensis.exe")) {
            choco install nsis --version 3.13.0 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco could not install NSIS 3.13.0" }
          }
          if (-not (Test-Path "$dir\makensis.exe")) { throw "makensis.exe is not in $dir" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir
          & "$dir\makensis.exe" /VERSION

      # The packaging tools for Linux's native formats: dpkg-shlibdeps for the
      # .deb, rpmbuild (and rpm2cpio, to open it) for the .rpm. CPack drops a
      # generator whose tool is missing, so the checks below would otherwise be the
      # first to notice.
      - name: Install packaging tools (Linux, command line)
        if: matrix.leg == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm cpio

      # What Qt itself needs on a bare Ubuntu: the GL and EGL loaders and a software
      # renderer for the offscreen smoke, the X, font and D-Bus libraries its
      # platform plugin links, and the validators the AppImage recipe uses. The
      # list is Qt's documented one for Linux; it is unmeasured on the hosted image
      # (docs/ci.md, "Releases"). The last line is what Qt Multimedia's FFmpeg backend looks
      # for at run time (PipeWire, and VA-API for the hardware decoders): without it Qt
      # warns once per library that it could not load it, and the QML suites that show the
      # camera's live view fail on a warning. libspeechd2 is a dependency of Qt's speech plugin (the
      # Linux voice): the AppImage tool refuses to build when it cannot find it.
      - name: Install what Qt needs (Linux, application)
        if: matrix.leg == 'linux-app'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev libegl1 libopengl0 libgl1-mesa-dri \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libx11-xcb1 libxi6 libsm6 libice6 libxrender1 \
            libpulse-dev libasound2-dev libwayland-client0 \
            libpipewire-0.3-0t64 libva2 libva-x11-2 libva-drm2 libspeechd2 \
            desktop-file-utils appstream file

      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          APP: ${{ matrix.app }}
          QT_ROOT_DIR: ${{ runner.temp }}/Qt/6.12.0/${{ matrix.qt-dir }}
          # rc.1 for v0.1.0-rc.1: the packages then carry 0.1.0-rc.1 and not 0.1.0.
          PRERELEASE: ${{ needs.prepare.outputs.suffix }}
        run: cmake --preset "$CMAKE_PRESET" -DWJS_BUILD_APP="$APP" -DWJS_PACKAGE_PRERELEASE="$PRERELEASE"

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$CMAKE_PRESET"

      # The whole suite, on the Release build that is about to be packaged. The
      # test preset errors out when no test is found.
      - name: Test
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '' }}
        run: ctest --preset "$CMAKE_PRESET"

      # The window starts, loads every screen and presents frames (docs/profiling.md,
      # "The smoke mode"). The window may present no frame offscreen, so this is the
      # start-up path and the 2D graph. The macOS bundle and the AppImage are smoked again from
      # the package they end up in.
      - name: Application smoke
        if: matrix.leg == 'windows' || matrix.leg == 'linux-app'
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: opengl
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            build/"$CMAKE_PRESET"/bin/WordJewelsSolver.exe --smoke 60
          else
            build/"$CMAKE_PRESET"/bin/WordJewelsSolver --smoke 60
          fi

      # Authenticode, behind the repository variable SIGN_WINDOWS (docs/releasing.md,
      # "Windows signing"): false (the default) leaves the programs as built, test signs
      # them with the leaf certificate of the owner's personal CA, production is not yet
      # chosen and fails. The two programs are signed where they are built, so the ZIP and
      # the installer carry the signed files; the files keep their names, and the packages
      # take the suffix below.
      - name: Sign the programs (Windows)
        if: matrix.leg == 'windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: |
            build/${{ matrix.preset }}/bin/WordJewelsSolver.exe
            build/${{ matrix.preset }}/bin/wjs-cli.exe
          rename: "false"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # The ZIP, from the script a developer runs too: it checks the contents,
      # forbids a TracyClient, AddressSanitizer runtime or .pdb, unpacks it, solves a
      # board with the packaged wjs-cli and runs the packaged window offscreen
      # (docs/building.md#checking-a-package).
      - name: Package and check the ZIP (Windows)
        if: matrix.leg == 'windows'
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: ./tools/package/check_package.ps1 -Build "build/$env:CMAKE_PRESET"

      # The installer, and proof it installs and runs: a silent install into a
      # scratch directory, the programs and Qt in it, and the solver run from it.
      - name: Package and check the NSIS installer (Windows)
        if: matrix.leg == 'windows'
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $PWD "build/$env:CMAKE_PRESET"
          Push-Location $build
          try {
            cpack -G NSIS --config CPackConfig.cmake
            if ($LASTEXITCODE -ne 0) { throw "cpack -G NSIS exited $LASTEXITCODE" }
          } finally { Pop-Location }
          $installer = @(Get-ChildItem (Join-Path $build 'packages') -Filter *.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $target = Join-Path $env:RUNNER_TEMP 'wjs-installed'
          # /D= must be the last argument and is not quoted (NSIS).
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installer exited $($process.ExitCode)" }
          foreach ($relative in 'bin\wjs-cli.exe', 'bin\WordJewelsSolver.exe', 'bin\Qt6Core.dll', 'bin\dictionaries\en.txt', 'bin\NOTICES.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $target $relative))) { throw "the installed tree has no $relative" }
          }
          $solved = & (Join-Path $target 'bin\wjs-cli.exe') CAT ORE DGS
          foreach ($word in 'CAT', 'CARE', 'TAR') {
            if (-not ($solved -match "(?m)^$word\s")) { throw "the installed wjs-cli did not find $word" }
          }
          Write-Host "installer ok: $($installer[0].Name) installs, and the installed wjs-cli solves a board"
          $uninstaller = Join-Path $target 'Uninstall.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$target" -Wait | Out-Null
          }

      # The installer carries the signature of its own (Authenticode, same mode as above) and
      # the name that says so: -unsigned, -testsigned or, for production, none. The ZIP gets
      # the same suffix, so a download says what it is without opening it.
      - name: Find the Windows packages
        if: matrix.leg == 'windows'
        id: windows-packages
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $PWD "build/$env:CMAKE_PRESET/packages"
          $installer = @(Get-ChildItem $packages -Filter *.exe)
          $zip = @(Get-ChildItem $packages -Filter *.zip)
          if ($installer.Count -ne 1) { throw "expected one installer in $packages, found $($installer.Count)" }
          if ($zip.Count -ne 1) { throw "expected one ZIP in $packages, found $($zip.Count)" }
          "installer=$($installer[0].FullName)" >> $env:GITHUB_OUTPUT
          "zip=$($zip[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign and name the installer (Windows)
        if: matrix.leg == 'windows'
        id: sign-installer
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: ${{ steps.windows-packages.outputs.installer }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Name the ZIP like the installer (Windows)
        if: matrix.leg == 'windows'
        shell: pwsh
        env:
          ZIP: ${{ steps.windows-packages.outputs.zip }}
          SUFFIX: ${{ steps.sign-installer.outputs.suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SUFFIX -eq '') { Write-Host 'No suffix: the ZIP keeps its name.'; exit 0 }
          $item = Get-Item -LiteralPath $env:ZIP
          $renamed = Join-Path $item.DirectoryName ($item.BaseName + $env:SUFFIX + $item.Extension)
          Move-Item -LiteralPath $item.FullName -Destination $renamed
          Write-Host "ZIP: $($item.Name) -> $(Split-Path $renamed -Leaf)"

      # Linux, command line: ZIP, tar.gz, .deb and .rpm. macOS: ZIP and disk image
      # (the ZIP is made but not published: its application would be unsigned).
      # Every generator the configure selected runs (cmake/Packaging.cmake).
      - name: Package (Linux command line, macOS)
        if: matrix.leg == 'linux' || matrix.leg == 'macos'
        shell: bash
        env:
          PACKAGE_PRESET: ${{ matrix.package-preset }}
        run: cpack --preset "$PACKAGE_PRESET"

      # The application's own Linux package: an AppImage that carries Qt
      # (libs/platforms/linux/packaging/build_appimage.sh). The tarball CPack would
      # make of it has no Qt, so it is not made.
      - name: Package the AppImage (Linux application)
        if: matrix.leg == 'linux-app'
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
          QT_PREFIX: ${{ runner.temp }}/Qt/6.12.0/gcc_64
        run: |
          set -euo pipefail
          package_version="$VERSION${SUFFIX:+-$SUFFIX}"
          libs/platforms/linux/packaging/build_appimage.sh \
            --build "build/$CMAKE_PRESET" --version "$package_version" \
            --out "build/$CMAKE_PRESET/packages" --qt-prefix "$QT_PREFIX" --smoke

      - name: Smoke-test every package (Linux command line, macOS)
        if: matrix.leg == 'linux' || matrix.leg == 'macos'
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          shopt -s nullglob
          tools/release/smoke_package.sh build/"$CMAKE_PRESET"/packages/*.{zip,tar.gz,deb,rpm,dmg}

      # The bundle: Info.plist, the camera text, Qt inside it, no link to the build
      # machine, and the application starting from the image.
      - name: Verify the application bundle (macOS)
        if: matrix.leg == 'macos'
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          for dmg in build/"$CMAKE_PRESET"/packages/*.dmg; do
            libs/platforms/macos/packaging/verify_bundle.sh "$dmg" --version "$VERSION" --smoke
          done

      # Sign, notarise and staple when the six secrets exist; say so and carry on
      # unsigned when none does (an incomplete set is an error). The signed image
      # is then verified again, with the signature.
      - name: Sign and notarise the disk image (macOS)
        if: matrix.leg == 'macos'
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in build/"$CMAKE_PRESET"/packages/*.dmg; do
            libs/platforms/macos/packaging/sign_and_notarize.sh "$dmg"
            if [ -n "$MACOS_SIGN_IDENTITY" ]; then
              libs/platforms/macos/packaging/verify_bundle.sh "$dmg" --version "$VERSION" --signed
            fi
          done

      # The profiler is off in the cache and absent from every package that can
      # be listed; the packages that must exist for this platform do.
      - name: Check the build and its packages
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          LEG: ${{ matrix.leg }}
        run: |
          $expect = switch ($env:LEG) {
            'windows' { @('.zip', '.exe') }
            'linux' { @('.zip', '.tar.gz', '.deb', '.rpm') }
            'linux-app' { @('.AppImage') }
            'macos' { @('.zip', '.dmg') }
          }
          ./tools/release/check_release_build.ps1 -Build "build/$env:CMAKE_PRESET" -Expect $expect

      # What is published from each leg. The ZIP of the macOS leg holds an application
      # that is not signed, and the tarball CPack could make of the Linux
      # application has no Qt in it, so neither is published; the AppImage and the
      # disk image are those platforms' packages of the application.
      - name: Collect the packages to publish
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages="build/$CMAKE_PRESET/packages"
          publish="build/$CMAKE_PRESET/publish"
          mkdir -p "$publish"
          case "$LEG" in
            windows) cp "$packages"/*.zip "$packages"/*.exe "$publish"/ ;;
            linux) cp "$packages"/*.zip "$packages"/*.tar.gz "$packages"/*.deb "$packages"/*.rpm "$publish"/ ;;
            linux-app) cp "$packages"/*.AppImage "$publish"/ ;;
            macos) cp "$packages"/*.dmg "$publish"/ ;;
          esac
          ls -l "$publish"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.leg }}
          path: build/${{ matrix.preset }}/publish/*
          if-no-files-found: error
          retention-days: 14

      # vcpkg writes an SPDX document for every port it installs; the SBOM job
      # reads them for the versions and licences of what built and tested this.
      - name: Upload vcpkg's SPDX documents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-inputs-${{ matrix.leg }}
          path: build/${{ matrix.preset }}/vcpkg_installed/**/vcpkg.spdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: ${{ matrix.triplet }}
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  # The iPhone/iPad application as an ad-hoc IPA: archived and exported by Xcode on
  # a macOS runner with the Apple Distribution certificate and the ad-hoc
  # provisioning profile (repository secrets), and a manifest.plist for the
  # over-the-air install (docs/ios-install.md). Both go to `assemble` and then to
  # Publish with the other packages, so they get the same checksums, GPG
  # signatures, attestation and SBOM entry as every other file.
  #
  # An ad-hoc build installs only on the devices the profile lists. A tag always
  # builds it; a manual run does unless its `ios` input is unticked; the weekly
  # rehearsal does not (docs/ci.md, "iOS"). This job has not run yet: expect the
  # first run to need fixes, and rehearse it with a dispatch before tagging.
  ios:
    name: Build the iOS ad-hoc IPA
    if: needs.prepare.outputs.ios == 'true'
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BUNDLE_ID: org.iainchesworth.wordjewelssolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before a Qt download of several gigabytes: the three secrets, by name. The
      # certificate and its password are the organisation's, the profile is this
      # repository's (docs/ci.md, "iOS"); the values are never printed.
      - name: Require the Apple signing secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -n "$IOS_DIST_CERT_P12_BASE64" ] || missing="$missing IOS_DIST_CERT_P12_BASE64 (organisation)"
          [ -n "$IOS_DIST_CERT_PASSWORD" ] || missing="$missing IOS_DIST_CERT_PASSWORD (organisation)"
          [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64 (repository)"
          if [ -n "$missing" ]; then
            echo "::error title=iOS signing secrets missing::Secret(s) not set:$missing. The Apple Distribution certificate and its password are organisation secrets that must reach this repository; the ad-hoc provisioning profile is a repository secret. To release without iOS, dispatch this workflow with the ios input unticked. docs/ios-install.md and docs/ci.md, 'iOS'."
            exit 1
          fi

      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # Qt's iOS kit, and the macOS kit aqtinstall's --autodesktop installs beside it
      # with the same modules, for the host tools a cross build runs. The pins
      # are .github/toolchain-versions.json's (qt.kits.ios).
      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtshadertools qtmultimedia qtsensors qtspeech"
          cache: false

      # Where the action put the two kits, which the preset reads (the runner
      # context is not available in a job-level env).
      - name: Name the Qt kits
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/6.12.0/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.12.0/macos" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          cmake --version | head -n 1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pwsh --version
          for kit in "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake"; do
            [ -e "$kit" ] || { echo "::error::$kit is not there: the Qt install put its kits somewhere else (look at the install step's log)"; exit 1; }
          done

      # The certificate goes into a keychain made for this job and the profile where
      # Xcode looks for it, and the profile is read and checked (the App ID against
      # BUNDLE_ID, its expiry, that it lists devices) before anything is built. Its
      # team ID and name come out as outputs, so no secret holds them. This and the
      # export below are icl-common-infra's actions (docs/ios-signing.md there); the
      # pin is the develop commit that added them, until a tag is cut.
      - name: Import the signing certificate and the provisioning profile
        id: signing
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@12e535686b7dfbae15ab454fd5f2fd511c6734d6 # develop 12e5356 (iOS signing actions, untagged)
        with:
          certificate-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          bundle-id: ${{ env.BUNDLE_ID }}

      # Unsigned for every target but the application: the preset turns signing off
      # project-wide, and the two cache variables turn it on for the application
      # alone (libs/platforms/ios/platform.cmake says why). The preset also asks for
      # the Xcode scheme that the export archives.
      - name: Configure (signed)
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: cmake --preset ios-release -DWJS_IOS_SIGNING_TEAM="$TEAM_ID" -DWJS_IOS_SIGNING_PROFILE="$PROFILE_NAME"

      - name: Name the IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
        run: echo "WJS_IOS_IPA=WordJewelsSolver-$VERSION${SUFFIX:+-$SUFFIX}-ios-adhoc.ipa" >> "$GITHUB_ENV"

      # `xcodebuild archive` and the ad-hoc export. The scheme is the CMake target's
      # name.
      - name: Archive and export the ad-hoc IPA
        uses: iainchesworthlabs/icl-common-infra/actions/export-ios-ipa@12e535686b7dfbae15ab454fd5f2fd511c6734d6 # develop 12e5356 (iOS signing actions, untagged)
        with:
          project: build/ios-release/WordJewelsSolver.xcodeproj
          scheme: WordJewelsSolver
          bundle-id: ${{ env.BUNDLE_ID }}
          team-id: ${{ steps.signing.outputs.team-id }}
          profile-name: ${{ steps.signing.outputs.profile-name }}
          output: ios-dist/${{ env.WJS_IOS_IPA }}

      # The signed IPA, opened as a user's device would: identifier, version, the
      # camera text, the icon, the data, arm64, the signature and an ad-hoc profile.
      - name: Check the IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: libs/platforms/ios/packaging/verify_ipa.sh "ios-dist/$WJS_IOS_IPA" --version "$VERSION" --signed

      # The manifest Safari's itms-services link reads: it names the IPA's URL as a
      # release asset, which does not exist until the publish job, so it is
      # written from the tag (tools/release/make_ios_manifest.sh).
      - name: Write the over-the-air install manifest
        if: ${{ vars.IOS_IPA_ON_RELEASE == 'true' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tools/release/make_ios_manifest.sh --out ios-dist/manifest.plist --ipa "$WJS_IOS_IPA" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" --bundle-id "$BUNDLE_ID"
          plutil -lint ios-dist/manifest.plist

      # An ad-hoc IPA carries its provisioning profile, which lists the UDIDs of the
      # devices, and this repository is public: attaching the IPA to the release
      # publishes them. So the IPA and its manifest go to the release (as package-ios,
      # which `assemble` and Publish take with the other packages) only when the
      # repository variable IOS_IPA_ON_RELEASE is true; otherwise the IPA is a
      # workflow artifact, kept 14 days, to install from a computer. docs/ci.md, "iOS".
      - name: Upload the IPA and its manifest (for the release)
        if: ${{ vars.IOS_IPA_ON_RELEASE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-ios
          path: ios-dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload the IPA (not for the release)
        if: ${{ vars.IOS_IPA_ON_RELEASE != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-adhoc
          path: ios-dist/${{ env.WJS_IOS_IPA }}
          if-no-files-found: error
          retention-days: 14

      # Whatever happened above, the certificate and the profile do not stay on the
      # runner.
      - name: Remove the signing keychain and the provisioning profile
        if: ${{ always() }}
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@12e535686b7dfbae15ab454fd5f2fd511c6734d6 # develop 12e5356 (iOS signing actions, untagged)
        with:
          remove: "true"

  # The Android application, as an APK and an AAB signed with the author's upload
  # key (repository secrets), which go to `assemble` and then to Publish with the
  # other packages and get the same checksums, GPG signatures, attestation and SBOM
  # entry as every other file.
  # The APK installs on a tablet that allows apps from outside the store; the AAB is
  # what Google Play takes later (docs/ci.md, "Android").
  #
  # The signing secrets are optional: with none of the four set, this job says so and
  # does nothing, and the release has no Android file (an Android package signed with
  # a throw-away key would be one nobody could update). With some of them set and not
  # the others it fails at once: that is a mistake, not a choice. A tag and a manual
  # run build it; the weekly rehearsal does not (the Qt kits are a download of
  # several gigabytes). This job has not run yet: rehearse it with a dispatch before
  # tagging.
  android:
    name: Build the signed Android packages
    if: needs.prepare.outputs.android == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The pins are .github/toolchain-versions.json's (android.*; tests/platform/
      # check_android.cmake holds this file to them).
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before a Qt download of several gigabytes: the four secrets, by name. The
      # values are never printed.
      - name: Look for the Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 4 ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Android package::None of the Android signing secrets is set, so this release has no Android APK or AAB. tools/release/new_android_keystore.sh makes the upload keystore and prints the gh secret set commands (docs/ci.md, 'Android')."
          else
            echo "::error title=Android signing secrets incomplete::Repository secret(s) not set:$missing. Set all four (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) or none of them; tools/release/new_android_keystore.sh makes them. docs/ci.md, 'Android'."
            exit 1
          fi

      - name: Set up vcpkg
        if: steps.signing.outputs.have == 'true'
        uses: ./.github/actions/vcpkg-setup

      - name: Install CMake 4 + Ninja
        if: steps.signing.outputs.have == 'true'
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Use the runner's JDK 17
        if: steps.signing.outputs.have == 'true'
        run: |
          set -euo pipefail
          jdk="${JAVA_HOME_17_X64:-}"
          [ -x "$jdk/bin/java" ] || { echo "::error::the runner image has no JDK 17 (JAVA_HOME_17_X64 is '$jdk')"; exit 1; }
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          "$jdk/bin/java" -version

      - name: Install the Android SDK parts
        if: steps.signing.outputs.have == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -d "$sdk" ] || { echo "::error::the runner image has no Android SDK (ANDROID_HOME is '$sdk')"; exit 1; }
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || { echo "::error::$sdkmanager is not there"; exit 1; }
          "$sdkmanager" --sdk_root="$sdk" --install "ndk;$ANDROID_NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # Qt's Android kit and the Linux kit aqtinstall's --autodesktop installs beside
      # it with the same modules, for the host tools. The pins are
      # .github/toolchain-versions.json's (qt.kits.android).
      - name: Install Qt (Android kit and Linux host kit)
        if: steps.signing.outputs.have == 'true'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtshadertools qtmultimedia qtsensors qtspeech"
          cache: false

      - name: Name the Qt kits
        if: steps.signing.outputs.have == 'true'
        run: |
          echo "QT_ANDROID_DIR=$RUNNER_TEMP/Qt/6.12.0/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.12.0/gcc_64" >> "$GITHUB_ENV"

      - name: Show the toolchain
        if: steps.signing.outputs.have == 'true'
        run: |
          cmake --version | head -n 1
          java -version
          cat "$ANDROID_NDK_ROOT/source.properties"
          for kit in "$QT_ANDROID_DIR/lib/cmake/Qt6/qt.toolchain.cmake" "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake" "$QT_HOST_PATH/bin/androiddeployqt"; do
            [ -e "$kit" ] || { echo "::error::$kit is not there: the Qt install put its kits somewhere else (look at the install step's log)"; exit 1; }
          done

      # The upload keystore goes into a file in the runner's temporary directory,
      # which androiddeployqt reads through QT_ANDROID_KEYSTORE_PATH and the
      # passwords through their own variables (the same ones the secrets fill).
      # Neither is written to the log, and the file does not stay on the runner.
      - name: Write the upload keystore
        if: steps.signing.outputs.have == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wjs-upload.p12"
          echo "WJS_ANDROID_KEYSTORE=$RUNNER_TEMP/wjs-upload.p12" >> "$GITHUB_ENV"

      - name: Configure (Release, signed)
        if: steps.signing.outputs.have == 'true'
        run: cmake --preset android-arm64-release -DQT_ANDROID_SIGN_APK=ON -DQT_ANDROID_SIGN_AAB=ON

      - name: Build the APK and the AAB
        if: steps.signing.outputs.have == 'true'
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ env.WJS_ANDROID_KEYSTORE }}
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
        run: |
          set -euo pipefail
          cmake --build --preset android-arm64-release
          cmake --build --preset android-arm64-release --target aab
          apk="$(find build/android-arm64-release -path '*outputs/apk/release/*' -name '*.apk' -type f | head -n 1)"
          aab="$(find build/android-arm64-release -path '*outputs/bundle/release/*' -name '*.aab' -type f | head -n 1)"
          [ -n "$apk" ] || { echo "::error::no release APK under build/android-arm64-release"; exit 1; }
          [ -n "$aab" ] || { echo "::error::no release AAB under build/android-arm64-release"; exit 1; }
          mkdir -p android-dist
          stem="WordJewelsSolver-$VERSION${SUFFIX:+-$SUFFIX}-android-arm64"
          cp "$apk" "android-dist/$stem.apk"
          cp "$aab" "android-dist/$stem.aab"
          echo "WJS_ANDROID_APK=$stem.apk" >> "$GITHUB_ENV"
          ls -l android-dist

      # The signed APK, opened as a device would: the application id, the version, the
      # platform levels, the camera as the only permission, arm64, not debuggable, and a
      # signature that is not Android's debug key.
      - name: Check the APK
        if: steps.signing.outputs.have == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: libs/platforms/android/packaging/verify_apk.sh "android-dist/$WJS_ANDROID_APK" --version "$VERSION" --release --signed

      - name: Upload the APK and the AAB
        if: steps.signing.outputs.have == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-android
          path: android-dist/*
          if-no-files-found: error
          retention-days: 14

      # Whatever happened above, the keystore does not stay on the runner.
      - name: Remove the upload keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/wjs-upload.p12"

  # The source archive and the SBOM, which describe the packages the build jobs
  # made. The iOS and Android jobs may have been left out of a rehearsal
  # (skipped), and Android does nothing without its secrets; a build that failed,
  # or an iOS or Android job that failed, stops here. A rehearsal ends here: the
  # files are the run's artifacts.
  assemble:
    name: Source archive and SBOM
    needs: [prepare, build, ios, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ios.result) && contains(fromJSON('["success","skipped"]'), needs.android.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Download vcpkg's SPDX documents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-inputs-*
          path: sbom-inputs

      # The source of exactly this commit, as a release asset: git archive at the
      # tagged commit (so .gitattributes' export-ignore decides what stays out),
      # with a fixed prefix and no timestamp in the gzip header, so the same commit
      # gives the same bytes.
      - name: Archive the source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prefix="WordJewelsSolver-${version}-source"
          mkdir -p extras
          git archive --format=tar --prefix="$prefix/" HEAD | gzip -n -9 > "extras/${prefix}.tar.gz"
          # No -q: grep -q leaves at the first match, and tar, still listing, is then written to a closed
          # pipe ("tar: stdout: write error", exit 2), which pipefail makes the step's failure.
          tar -tzf "extras/${prefix}.tar.gz" | grep -x "$prefix/CMakeLists.txt" > /dev/null
          ls -l "extras/${prefix}.tar.gz"

      - name: Generate the SBOM (CycloneDX 1.6)
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.Substring(1)
          ./tools/release/generate_sbom.ps1 -Tag $env:TAG -Commit $env:COMMIT -Repository $env:REPOSITORY `
            -PackagesDir dist -VcpkgSpdxDir sbom-inputs -Output "extras/WordJewelsSolver-$version.cdx.json"

      - name: Summarise
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          {
            echo "### Release files ($TAG, $MODE)"
            echo
            echo '```text'
            (cd dist && ls -l) | sed 's/^/  /'
            (cd extras && ls -l) | sed 's/^/  /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Named package-* so that the shared Publish job collects it with the
      # packages.
      - name: Upload the source archive and the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-extras
          path: extras/
          if-no-files-found: error
          retention-days: 14

  # The shared half of a release (icl-common-infra, release-publish.yml): the tag
  # is a semver tag on develop and the release has notes; SHA-512 sums; a detached
  # signature for every file with the organisation's key, checked against
  # docs/signing-key.asc; build-provenance attestations; the GitHub Release; and,
  # for a final release, the fast-forward of main by the release bot. It runs in
  # the `release` environment, so the owner approves each release. The SBOM is the
  # project's own (assemble), so the shared one is off.
  publish:
    name: Publish
    if: needs.prepare.outputs.mode == 'release'
    needs: [prepare, assemble]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
    with:
      artifact-pattern: "package-*"
      generate-sbom: false
      public-key: docs/signing-key.asc
      title: WordJewelsSolver ${{ github.ref_name }}
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # What only this project's release has: the install sections for the iPhone/iPad
  # and Android files, added to the notes the shared job wrote. GitHub's
  # release-notes renderer drops itms-services:// links, so the iOS link is to a
  # page (docs/install-ios.html, on the documentation site) that makes the real
  # one; it works only if that site is published.
  install-notes:
    name: Add the install notes
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Append the sections the release needs
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx 'manifest.plist' <<< "$assets"; then
            pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
            {
              echo
              echo "### Installing on an iPhone or iPad"
              echo
              echo "The \`.ipa\` is an ad-hoc build: it installs only on a device registered in its provisioning profile. On such a device, open this page in Safari and tap Install: $pages/install-ios.html?tag=$TAG. How it works, and how to add a device: $pages/ios-install/."
            } >> notes.md
          fi
          if grep -q -- '-android-arm64\.apk$' <<< "$assets"; then
            {
              echo
              echo "### Installing on an Android tablet or phone"
              echo
              echo "The \`-android-arm64.apk\` installs on an arm64 device that allows apps from outside the store (an app from your browser or file manager: the setting is per app, in the device's settings). It asks for the camera and nothing else. The \`.aab\` is the same program as an Android App Bundle, for Google Play."
            } >> notes.md
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
