name: OSV-Scanner

# Known vulnerabilities in what the repository pins, from the OSV database: the Python tools of
# the CI jobs (.github/requirements/*.txt, each named below) and any lockfile OSV-Scanner finds. vcpkg manifests are not a format it reads; the vcpkg dependencies are held by
# dependency-review.yml on a pull request that changes them (docs/ci.md, "Known vulnerabilities").
#
# Nightly, and by hand. A finding fails the run, goes to Security > Code scanning as SARIF and, on
# the schedule, opens or updates one `nightly-analysis` issue. Not a required check: it is not on a
# pull request or the merge queue, so it could not report on one.

on:
  schedule:
    # 04:17 UTC: after CodeQL (02:47) and the fuzzers (03:47), clear of the weekly release
    # rehearsal (Sunday 03:23) and Scorecard (Monday 04:00).
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    name: OSV-Scanner
    # The reusable workflow checks out the default branch on a schedule and the branch it was started on
    # by hand; it asks for exactly these three permissions.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # OSV-Scanner reads a file named requirements.txt and no other, so each pinned file of
      # .github/requirements is named, with the parser to read it by. A new one is added here;
      # tools/ci/test_osv_requirements.py holds the list to the directory. -r ./ still finds a lockfile
      # added later.
      scan-args: |-
        --lockfile=requirements.txt:.github/requirements/analysis.txt
        --lockfile=requirements.txt:.github/requirements/coverage.txt
        --lockfile=requirements.txt:.github/requirements/docs.txt
        --lockfile=requirements.txt:.github/requirements/lint.txt
        --lockfile=requirements.txt:.github/requirements/sbom.txt
        --lockfile=requirements.txt:.github/requirements/workflows.txt
        -r
        ./
      fail-on-vuln: true

  report:
    name: Report a failed scan
    needs: scan
    if: ${{ always() && needs.scan.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          engine: OSV-Scanner
          detail: The scan found a vulnerability in a pinned dependency, or failed to run. Open the run, or Security > Code scanning, bump the pin, or dismiss the alert with a justification.
