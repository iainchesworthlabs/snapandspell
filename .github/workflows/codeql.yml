name: CodeQL

# Static analysis (C++), nightly: the shared codeql.yml of icl-common-infra, which
# installs the toolchain, builds the preset below under CodeQL's tracer and opens or
# updates one `nightly-analysis` issue when the analysis fails.
#
# Public-only: code scanning of a private repository needs a paid plan, so the job is
# skipped - not red - while the repository is private (docs/ci.md, "Public-only
# workflows"). It is not a required check.
#
# Not on a push or a pull request: CodeQL's build and analysis are slower than the
# push legs, and its findings are a review queue rather than a merge gate. A person
# can still dispatch it on any branch from the Actions tab. A schedule runs the
# workflow file of the default branch, which is develop.

on:
  schedule:
    # 02:47 UTC, half an hour after analysis.yml, so the two nightly workflows
    # do not compete for the same runners.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A run on develop or main finishes; everything else is superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  codeql:
    name: CodeQL
    if: ${{ !github.event.repository.private }}
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@dd980dbe9d40a468cedf651de91bb429a4bbb10f # v0.1.16
    with:
      runner: '["ubuntu-26.04"]'
      # The lean build (the linux-gcc-analysis preset): the library, the platform
      # section, the scanner and the CLI, with no tests, no Qt application, Tracy off
      # and the sanitizers off - CodeQL's build tracer sets its own LD_PRELOAD for the
      # whole build step, which collides with ASan needing to be first in the preload
      # chain, and a static analysis gets nothing from them. The nightly run can afford
      # the larger suite: default plus the security queries not in the default suite. Qt is left out:
      # the preset builds no Qt code.
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-gcc-analysis", "vcpkg": true, "queries": "security-extended", "skip_qt": true}
        ]
