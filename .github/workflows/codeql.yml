name: CodeQL

# Static analysis (C++), nightly. Public-only: code scanning of a private
# repository needs a paid plan, so the job is skipped - not red - while the
# repository is private, and starts running the day it is made public
# (docs/ci.md, "Public-only workflows"). It is not a required check.
#
# Not on a push or a pull request: CodeQL's build and analysis are slower than
# the push legs, and its findings are a review queue rather than a merge gate.
# A person can still dispatch it on any branch from the Actions tab.

on:
  schedule:
    # 02:47 UTC, half an hour after analysis.yml, so the two nightly workflows
    # do not compete for the same runners.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A push to develop or main finishes; everything else is superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (C++)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sets VCPKG_ROOT for the presets - see ci.yml.
      - name: Set up vcpkg
        uses: ./.github/actions/vcpkg-setup

      # linux-gcc-debug turns Tracy on (docs/profiling.md), so the configure
      # below has vcpkg install it and build its host tools. That all happens
      # before CodeQL's tracer starts, and from the same archives as the Linux
      # (GCC) leg, so none of Tracy's or vcpkg's own code is extracted and
      # scored as ours.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: x64-linux

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Install what vcpkg needs for Tracy's tools
        uses: ./.github/actions/linux-tracy-tools

      # The lean build: the library, the platform section and the CLI, with no
      # tests and no Qt application. Sanitizers off: CodeQL's build tracer sets
      # its own LD_PRELOAD for the whole build step, which collides with ASan
      # needing to be first in the preload chain, and a static analysis gets
      # nothing from them. Configure is before the tracer: it compiles nothing
      # of ours, and the build below is what CodeQL has to see.
      - name: Configure (library, platform and CLI only)
        run: >
          cmake --preset linux-gcc-debug
          -DWJS_BUILD_TESTS=OFF
          -DWJS_BUILD_APP=OFF
          -DWJS_ENABLE_SANITIZERS=OFF

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: cpp
          build-mode: manual
          # The nightly run can afford the larger suite: default plus the
          # security queries that are not in the default suite.
          queries: security-extended

      - name: Build
        run: cmake --build --preset linux-gcc-debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:cpp"

      # Saved even when the analysis fails - see ci.yml.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: x64-linux
          restored: ${{ steps.vcpkg-cache.outputs.listing }}
